# Deploys the static site when it changes on master. Runs only for these paths, so other pushes cost no minutes.
name: Deploy hosting

on:
  push:
    branches: [master]
    paths:
      - frontend-firebase/public/**
      - frontend-firebase/firebase.json
      - .github/workflows/deploy-hosting.yml
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud (Workload Identity Federation)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-firebase
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npx -y firebase-tools@14 deploy --only hosting --project gen-lang-client-demo --non-interactive
